name: release

# A tag v<version> publishes a GitHub release holding the five binaries and their
# checksums. The tag must match package.json; the macOS binaries are signed ad hoc on a
# macOS runner because Apple Silicon refuses unsigned ones. It then starts distribute.yml, which
# publishes to npm, the tap and the marketplace and moves the image's latest tag
# (docs/runbooks/release.md).
#
# The image this workflow builds is the one distribute.yml signs, by the digest the docker job
# records (ADR 0032). So it is held as that workflow is: every action pinned by commit, no run:
# interpolating an expression, no checkout keeping credentials, each job with only the
# permissions it needs. tests/unit/deploy-files.test.ts holds it.

on:
  push:
    tags: ["v*"]

# No job has more than it needs: only publish writes the repository (it makes the release).
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: The tag names the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      - run: bun run check
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: dist/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: dist
      - run: |
          for file in dist/wizardingcode-mem-darwin-*; do
            chmod +x "$file"
            codesign --force --sign - "$file"
            codesign --verify --verbose "$file"
            "$file" --version
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  # The team server's image (ADR 0026): the signed release's Linux binaries into one image
  # for both platforms, tagged with the version. distribute.yml moves latest, last.
  docker:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      # The docker actions stay on the majors every release so far was built with; distribute.yml,
      # written later, has newer ones. Each is the commit of the release its comment names.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          # A registry reference carries no capitals.
          images: ghcr.io/wizardingcode-io/wizardingcode-mem
          tags: |
            type=semver,pattern={{version}}
          # The action's default adds latest to a plain release; latest is moved once, last,
          # by distribute.yml (ADR 0029, ADR 0031).
          flavor: latest=false
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # The digest of the index this build pushed, from the build itself and never from the
      # tag read back: it is what distribute.yml signs (ADR 0032). Printed, so that the person
      # who approves the signing can read it here; kept as an artifact, which plan reads.
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$DIGEST" | tee image-digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: image-digest.txt
          if-no-files-found: error
          # A re-run of this job replaces the record; without this the second upload fails.
          overwrite: true

  publish:
    needs: [sign, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history, with tags: the Changes list reaches back to the previous release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - name: Checksums
        run: |
          cd dist
          chmod +x wizardingcode-mem-*
          sha256sum wizardingcode-mem-* > checksums.txt
          cat checksums.txt
      - name: Release notes
        run: |
          {
            echo "## Install"
            echo
            echo "From inside your agent — see the [README](https://github.com/${GITHUB_REPOSITORY}#install) for each one. For example:"
            echo
            echo '```sh'
            echo "claude plugin marketplace add WizardingCode-io/wizardingcode-plugins && claude plugin install wizardingcode-mem@wizardingcode-plugins"
            echo "codex plugin marketplace add WizardingCode-io/wizardingcode-plugins && codex plugin add wizardingcode-mem@wizardingcode-plugins"
            echo '```'
            echo
            echo "The \`wizardingcode-mem-*\` files are the binaries the plugins fetch."
            echo
            echo "## Changes"
            echo
            # A plain release lists what changed since the previous plain one, pre-releases included.
            case "${GITHUB_REF_NAME}" in
              *-*) previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)" ;;
              *) previous="$(git describe --tags --abbrev=0 --exclude '*-*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)" ;;
            esac
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..${GITHUB_REF_NAME}"
            else
              git log --no-merges --format='- %s' "${GITHUB_REF_NAME}" | head -50
            fi
          } > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; *) prerelease="" ;; esac
          gh release create "${GITHUB_REF_NAME}" $prerelease --title "wizardingcode-mem ${GITHUB_REF_NAME#v}" --notes-file notes.md dist/wizardingcode-mem-* dist/checksums.txt

  # The rest of the release (npm, the tap, the marketplace, the image's latest tag) is
  # distribute.yml's, always run from main: a tag's own copy of that workflow is never trusted.
  distribute:
    needs: publish
    runs-on: ubuntu-latest
    # It only starts the other workflow; docs/runbooks/release.md says what to do when it is cut.
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run distribute.yml --ref main -f tag="$GITHUB_REF_NAME"
