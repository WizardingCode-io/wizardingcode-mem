name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type check, lint and the whole test suite, including the end-to-end and latency
  # tests, which build and drive this platform's release binary.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
      # The team server's image (ADR 0026), built for this runner's architecture from dist/
      # and run as the compose file runs it: hardened, as user 10001, healthy, stopping clean.
      - name: The image builds, starts, answers health and stops with exit 0
        run: |
          set -eu
          docker build -t wizardingcode-mem:ci .
          docker run --rm wizardingcode-mem:ci --version
          docker run -d --name wcm --init --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true -v wcm-data:/data wizardingcode-mem:ci
          healthy=0
          for _ in $(seq 1 30); do
            if docker exec wcm wizardingcode-mem serve health; then healthy=1; break; fi
            sleep 1
          done
          test "$healthy" = 1
          test "$(docker exec wcm id -u)" = 10001
          docker stop -t 30 wcm
          test "$(docker inspect -f '{{.State.ExitCode}}' wcm)" = 0
          docker logs wcm
          docker rm wcm
          docker volume rm wcm-data

  # Every binary is executed on the platform it targets: it must start, and the
  # platform probes (FTS5, startup latency, WAL, detached child, .env isolation, MCP) must pass.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, file: wizardingcode-mem-darwin-arm64 }
          - { os: macos-15-intel, file: wizardingcode-mem-darwin-x64 }
          - { os: ubuntu-latest, file: wizardingcode-mem-linux-x64 }
          - { os: ubuntu-24.04-arm, file: wizardingcode-mem-linux-arm64 }
          - { os: windows-latest, file: wizardingcode-mem-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - if: runner.os != 'Windows'
        run: chmod +x "dist/${{ matrix.file }}"
      # Cross-compiled macOS binaries are unsigned; Apple Silicon refuses to run those.
      - if: runner.os == 'macOS'
        run: |
          codesign --force --sign - "dist/${{ matrix.file }}"
          codesign --verify --verbose "dist/${{ matrix.file }}"
      - run: '"dist/${{ matrix.file }}" --version'
      - name: Platform probes
        run: '"dist/${{ matrix.file }}" __spike all | tee "spikes-${{ matrix.file }}.json"'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spikes-${{ matrix.file }}
          path: spikes-${{ matrix.file }}.json
